name: Build Hentai IMG title index
on:
  push:
    branches: [main]
    paths: ['scripts/build_hentaiimg_index.py', '.github/workflows/hentaiimg-index.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: write
concurrency:
  group: extension-store
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Build gallery-name shards
        run: python scripts/build_hentaiimg_index.py
      - name: Publish lookup index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/search/hentaiimg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Hentai IMG gallery-name index"
            git pull --rebase
            git push
          fi
